[project]
name = "macos-arctis-manager"
version = "0.1.0"
description = "Menu-bar manager for the SteelSeries Arctis Nova Pro Wireless on macOS. Port of Linux-Arctis-Manager."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "hidapi>=0.14",
    "rumps>=0.4.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
arctis-manager = "macos_arctis_manager.menubar:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "macos_arctis_manager"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=8",
]
